<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>カードバトラー★ケン2 ～お前のターンもある～</title>
<meta name="description" content="集めた仲間カードで戦う麻雀風の対戦ゲーム。3枚×3セットを揃えて殲滅！ダークを3枚集めれば相手のカードを略奪できる。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yuji+Boku&display=swap">
<style>
  :root{
    --bg1:#1a0e0e; --bg2:#3a1414;
    --ink:#2a1414;
    --accent:#e0472c; --accent2:#f5b942;
    --light:#f5b942; --dark:#8a5cd6; --plain:#b9b2a8;
    --tcg-font:'Yuji Boku', "Hiragino Mincho ProN", serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    font-family:"Hiragino Maru Gothic ProN","Rounded Mplus 1c","Yu Gothic",sans-serif;
    background:radial-gradient(circle at 50% 0%, var(--bg2), var(--bg1) 75%);
    color:#f6ece0; display:flex; justify-content:center;
    padding:14px 10px 20px;
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{ width:100%; max-width:480px; }
  h1{ text-align:center; font-size:1.2rem; margin:0; font-family:var(--tcg-font); letter-spacing:.03em; }
  .subtitle{ text-align:center; font-size:.85rem; font-weight:900; color:var(--accent2); font-family:var(--tcg-font); margin:0 0 6px; }

  /* ステータスバー */
  .status{
    display:flex; justify-content:space-between; align-items:center; gap:6px;
    background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.14);
    border-radius:12px; padding:6px 10px; font-size:.8rem; margin-bottom:8px;
  }
  .status b{ color:var(--accent2); font-size:1rem; }
  .status .sc{ text-align:center; line-height:1.25; }

  .area{
    background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.12);
    border-radius:14px; padding:6px 8px 8px; margin-bottom:6px;
  }
  .area h2{ font-size:.72rem; margin:0 0 4px; opacity:.85; font-weight:700; display:flex; justify-content:space-between; }

  /* ==== カード（9本目と同じTCG風の二重縁取り） ==== */
  .card{
    position:relative; aspect-ratio:3/4; border-radius:8px; overflow:hidden;
    border:3px solid var(--plain); background:#231616;
    display:flex; flex-direction:column; cursor:pointer;
    transition:transform .12s ease;
  }
  .card::after{
    content:""; position:absolute; inset:2px;
    border:1.5px solid rgba(255,255,255,.38); border-radius:5px; pointer-events:none; z-index:2;
  }
  .card.light{ border-color:var(--light); }
  .card.dark{ border-color:var(--dark); background:#1a1230; }
  .card.ultra{ border-color:transparent; background:linear-gradient(#231616,#231616) padding-box, linear-gradient(135deg,#ff5f6d,#ffc371,#47e3a1,#4facfe,#c471f5) border-box; }
  .card .pic{ flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding:2px; }
  .card .pic img{ max-width:100%; max-height:100%; width:auto; height:auto; object-fit:contain; display:block; }
  .card .lab{
    font-size:.62rem; font-weight:900; text-align:center; padding:1px 0 2px; line-height:1.1;
    background:rgba(0,0,0,.45); color:#fff;
  }
  .card.light .lab{ color:var(--light); }
  .card.dark .lab{ color:#c9a9ff; }
  .card.ultra .lab{ color:#ffe27a; }
  .card.back{
    background:repeating-linear-gradient(45deg,#4a1c1c,#4a1c1c 6px,#5c2424 6px,#5c2424 12px); border-color:#8a4a2a; cursor:default;
  }
  .card.back .pic{ font-size:1.1rem; opacity:.5; }
  .card.mini{ border-width:2px; border-radius:5px; cursor:default; }
  .card.mini::after{ inset:1px; border-width:1px; border-radius:3px; }
  .card.mini .lab{ font-size:.5rem; }

  .hand{ --cw:calc((min(100vw,480px) - 74px) / 6); display:flex; flex-wrap:wrap; gap:8px 6px; align-items:flex-end; }
  .hand .card{ width:var(--cw); flex:none; }
  .hand .card .lab{ font-size:.58rem; }
  .grp{ position:relative; display:flex; gap:2px; padding:7px 3px 3px; border:2px solid #f5d76e; border-radius:11px; background:rgba(245,215,110,.10); box-shadow:0 0 8px rgba(245,215,110,.35); }
  .grp.partial{ border-style:dashed; border-color:rgba(255,255,255,.55); background:rgba(255,255,255,.05); box-shadow:none; }
  .grp::before{ content:attr(data-label); position:absolute; top:-8px; left:8px; font-size:.55rem; font-weight:900; line-height:1; padding:2px 6px; border-radius:8px; background:#f5d76e; color:#3a2a10; white-space:nowrap; }
  .grp.partial::before{ background:#5a4a4a; color:#fff; }
  .hand .card.selected{ transform:translateY(-8px); box-shadow:0 0 0 2px #fff, 0 6px 12px rgba(0,0,0,.5); }
  .hand .card.fresh{ animation:fresh 1.1s ease-in-out infinite; }
  @keyframes fresh{ 0%,100%{ box-shadow:0 0 0 0 rgba(255,255,255,0);} 50%{ box-shadow:0 0 10px 3px rgba(255,255,255,.85);} }
  .backs{ display:grid; grid-template-columns:repeat(10,1fr); gap:3px; }
  .disc{ display:grid; grid-template-columns:repeat(10,1fr); gap:3px; min-height:24px; }
  .empty{ font-size:.7rem; opacity:.5; grid-column:1/-1; }

  /* メッセージ */
  .msg{
    min-height:40px; display:flex; align-items:center; justify-content:center; text-align:center;
    font-weight:900; font-size:.95rem; color:var(--accent2);
    background:rgba(0,0,0,.25); border-radius:12px; padding:6px 10px; margin-bottom:4px; line-height:1.4;
  }
  .log{ font-size:.66rem; opacity:.7; line-height:1.45; margin:0 4px 6px; min-height:2.9em; }

  /* ボタン */
  .btns{
    display:grid; grid-template-columns:repeat(3,1fr); gap:8px;
    position:sticky; bottom:0; z-index:5; padding:8px 0 6px;
    background:linear-gradient(to top, var(--bg1) 70%, rgba(26,14,14,0));
  }
  button.act{
    font-family:var(--tcg-font); font-weight:900; font-size:.95rem; letter-spacing:.02em;
    border:none; border-radius:14px; padding:14px 2px; color:#2a1414; background:#8d8177;
    box-shadow:0 4px 0 rgba(0,0,0,.35); opacity:.4; cursor:default;
  }
  button.act.on{ opacity:1; cursor:pointer; }
  button.act:active.on{ transform:translateY(2px); box-shadow:0 2px 0 rgba(0,0,0,.35); }
  #btnWin.on{ background:var(--accent); color:#fff; animation:glow 0.9s ease-in-out infinite; }
  #btnRon.on{ background:#ff8a1f; color:#fff; animation:glow 0.9s ease-in-out infinite; }
  #btnSteal.on{ background:#6b3fc7; color:#fff; }
  #btnSteal.on.glow{ animation:glowPurple 0.9s ease-in-out infinite; }
  #btnDiscard.on{ background:var(--accent2); }
  #btnPass.on{ background:#6f655c; color:#fff; }
  @keyframes glow{ 0%,100%{ box-shadow:0 4px 0 rgba(0,0,0,.35), 0 0 0 0 rgba(255,220,120,.0);} 50%{ box-shadow:0 4px 0 rgba(0,0,0,.35), 0 0 16px 5px rgba(255,220,120,.9);} }
  @keyframes glowPurple{ 0%,100%{ box-shadow:0 4px 0 rgba(0,0,0,.35), 0 0 0 0 rgba(160,110,255,0);} 50%{ box-shadow:0 4px 0 rgba(0,0,0,.35), 0 0 16px 5px rgba(160,110,255,.9);} }
  .btns .span2{ grid-column:span 2; }
  .hidden{ display:none !important; }

  /* オーバーレイ */
  .overlay{
    position:fixed; inset:0; background:rgba(10,4,4,.86); z-index:50;
    display:flex; align-items:center; justify-content:center; padding:16px;
  }
  .modal{
    width:100%; max-width:440px; max-height:92vh; overflow:auto;
    background:#2a1616; border:3px solid var(--accent2); border-radius:18px; padding:16px 14px 18px; text-align:center;
  }
  .modal h3{ margin:0 0 8px; font-family:var(--tcg-font); color:var(--accent2); font-size:1.3rem; }
  .modal p{ font-size:.85rem; line-height:1.6; margin:6px 0; }
  .modal .yaku{ text-align:left; background:rgba(0,0,0,.25); border-radius:10px; padding:8px 12px; margin:10px 0; font-size:.85rem; line-height:1.7; }
  .modal .yaku .row{ display:flex; justify-content:space-between; }
  .modal .yaku .total{ border-top:1px solid rgba(255,255,255,.25); margin-top:4px; padding-top:4px; font-weight:900; color:var(--accent2); }
  .modal .hand-show{ display:flex; flex-wrap:wrap; gap:14px 6px; justify-content:center; margin:16px 0 8px; }
  .modal .hand-show .card{ width:44px; flex:none; }
  .modal .legend{ font-size:.7rem; opacity:.75; margin:2px 0 6px; line-height:1.5; }
  .modal .pick-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin:10px 0; }
  .modal .pick-grid .card{ position:relative; }
  .modal .pick-grid .cnt{ position:absolute; bottom:16px; right:3px; z-index:3; background:#000a; border-radius:8px; font-size:.65rem; padding:0 5px; }
  .modal .row-btns{ display:flex; gap:8px; margin-top:10px; }
  .modal .row-btns button{ flex:1; }
  button.plain{
    font-family:var(--tcg-font); font-weight:900; font-size:1rem; border:none; border-radius:12px; padding:10px 8px;
    background:var(--accent2); color:#2a1414; cursor:pointer; box-shadow:0 3px 0 rgba(0,0,0,.35);
  }
  button.plain.sub{ background:#6f655c; color:#fff; }
  .flash{
    position:fixed; inset:0; z-index:60; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(20,0,30,.72); pointer-events:none; animation:flashIn .25s ease-out;
  }
  .flash .big{ font-family:var(--tcg-font); font-size:2.6rem; font-weight:900; color:#fff; text-shadow:0 0 18px var(--dark), 0 0 6px #000; letter-spacing:.06em; text-align:center; padding:0 12px; }
  .flash .small{ margin-top:10px; font-size:1rem; color:var(--accent2); font-weight:900; text-align:center; padding:0 16px; }
  @keyframes flashIn{ from{ opacity:0; transform:scale(1.15);} to{ opacity:1; transform:scale(1);} }
  .versus{ display:flex; gap:12px; justify-content:center; margin:10px 0; }
  .versus .side{ width:42%; }
  .versus .side .who{ font-size:.8rem; margin-bottom:4px; }
  .versus .card{ cursor:default; }

  .flash img{ width:94%; max-width:460px; height:auto; animation:fxPop .55s cubic-bezier(.2,1.4,.4,1); filter:drop-shadow(0 0 18px rgba(0,0,0,.6)); }
  @keyframes fxPop{ from{ transform:scale(.4); opacity:0; } to{ transform:scale(1); opacity:1; } }
  .back-link{ display:inline-block; font-size:.8rem; font-weight:700; color:#f6ece0; opacity:.65; text-decoration:none; margin-bottom:6px; }
  .back-link-btn{ display:block; background:var(--accent2); color:#2a1414; font-size:1.05rem; font-weight:900; text-decoration:none; text-align:center; padding:14px 16px; border-radius:14px; margin-top:20px; box-shadow:0 4px 0 var(--accent); }
  .back-link-btn:active{ transform:translateY(2px); box-shadow:0 2px 0 var(--accent); }
  .x-share-zone{ margin-top:22px; padding-top:14px; border-top:1px dashed rgba(255,255,255,.25); text-align:center; }
  .x-share-title{ font-size:1rem; font-weight:bold; color:var(--accent2); margin-bottom:12px; }
  .x-link-btn{ display:block; background:#000; color:#fff; font-size:1rem; font-weight:900; text-align:center; padding:14px; border-radius:14px; box-shadow:0 4px 0 #444; border:none; width:100%; max-width:320px; margin:0 auto; cursor:pointer; font-family:inherit; }
  .x-link-btn:active{ transform:translateY(2px); box-shadow:0 2px 0 #444; }
  .usage-notice{ margin-top:18px; font-size:.72rem; line-height:1.8; opacity:.85; text-align:left; background:rgba(255,255,255,.06); border-radius:10px; padding:12px 14px; border:1px solid rgba(255,255,255,.16); }
  .usage-notice .usage-title{ font-weight:bold; color:var(--accent2); display:block; margin-bottom:4px; }

  .toprow{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .toprow .back-link{ margin-bottom:0; }
  .rule-btn{ font-family:inherit; font-weight:900; font-size:.85rem; border:none; border-radius:999px; padding:6px 14px; background:var(--accent2); color:#2a1414; cursor:pointer; box-shadow:0 2px 0 rgba(0,0,0,.35); }
  .hintbar{ font-size:.74rem; line-height:1.5; text-align:center; background:rgba(0,0,0,.28); border-radius:8px; padding:4px 8px; margin-bottom:6px; min-height:2.2em; }
  .hintbar b{ color:var(--accent2); }
  .card.reach::before{ content:'リーチ'; position:absolute; bottom:15px; left:50%; transform:translateX(-50%); z-index:4; font-size:.5rem; font-weight:900; line-height:1; padding:2px 5px; white-space:nowrap; border-radius:6px; background:#ff5a36; color:#fff; box-shadow:0 1px 3px rgba(0,0,0,.5); pointer-events:none; }
  .card .mk{ position:absolute; top:1px; left:2px; z-index:3; font-size:.7rem; line-height:1; filter:drop-shadow(0 0 2px #000); pointer-events:none; }
  .card .pt{ position:absolute; top:2px; right:2px; z-index:3; font-size:.6rem; font-weight:900; line-height:1; padding:1px 3px; border-radius:6px; background:rgba(0,0,0,.7); color:#fff; pointer-events:none; }
  .card.mini .mk{ font-size:.5rem; top:0; left:1px; }
  .card.mini .pt{ font-size:.42rem; top:1px; right:1px; padding:1px 2px; border-radius:4px; }
  .card.big .mk{ font-size:1.5rem; top:4px; left:6px; }
  .card.big .pt{ font-size:1.05rem; top:5px; right:6px; padding:2px 7px; border-radius:10px; }
  .card.big{ border-width:4px; border-radius:14px; cursor:default; }
  .card.big::after{ inset:3px; border-radius:9px; }
  .card.big .lab{ font-size:1rem; padding:4px 0 5px; }
  .reveal{ cursor:pointer; flex-direction:column; text-align:center; }
  .reveal .rv-title{ font-family:var(--tcg-font); font-size:1.5rem; color:var(--accent2); margin-bottom:14px; text-shadow:0 0 12px #000; }
  .reveal .rv-row{ display:flex; gap:10px; justify-content:center; width:100%; }
  .reveal .rv-row .card{ animation:fxPop .45s cubic-bezier(.2,1.4,.4,1); }
  .reveal .rv-name{ margin-top:12px; font-weight:900; font-size:.95rem; }
  .reveal .rv-sub{ margin-top:6px; font-size:.85rem; color:var(--accent2); font-weight:900; }
  .reveal .rv-tap{ margin-top:16px; font-size:.7rem; opacity:.6; }
  .rules{ text-align:left; font-size:.82rem; line-height:1.65; }
  .rules h4{ margin:14px 0 4px; color:var(--accent2); font-size:.95rem; }
  .rules p{ margin:4px 0; }
  .rules .ex{ display:flex; gap:6px; align-items:center; margin:6px 0; }
  .rules .ex .card{ width:52px; flex:none; cursor:default; }
  .rules .ex .arrow{ opacity:.7; font-weight:900; }
  .rules table{ width:100%; border-collapse:collapse; font-size:.78rem; margin:4px 0; }
  .rules td{ padding:2px 4px; border-bottom:1px solid rgba(255,255,255,.12); }
  .rules td:last-child{ text-align:right; white-space:nowrap; color:var(--accent2); font-weight:900; }
  .rules .small{ font-size:.72rem; opacity:.75; }
  .note{ font-size:.7rem; opacity:.6; text-align:center; margin-top:12px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="toprow"><a href="../../" class="back-link">← ゲーム一覧に戻る</a><button type="button" class="rule-btn" id="ruleBtn">📖 ルール</button></div>
  <h1>カードバトラー★ケン2</h1>
  <div class="subtitle">～お前のターンもある～</div>

  <div class="status">
    <div>第<b id="stRound">1</b>/<span id="stRoundMax">4</span>局</div>
    <div class="sc">あなた <b id="stMe">0</b> － <b id="stCpu">0</b> 相手</div>
    <div>山札 <b id="stDeck">0</b></div>
  </div>

  <div class="area">
    <h2><span>👹 相手の手札（<span id="cpuCount">9</span>枚）</span><span id="cpuFirst"></span></h2>
    <div class="backs" id="cpuBacks"></div>
    <h2 style="margin-top:8px"><span>相手の捨て札</span></h2>
    <div class="disc" id="cpuDisc"></div>
  </div>

  <div class="msg" id="msg">読み込み中…</div>
  <div class="log" id="log"></div>

  <div class="area">
    <h2><span>あなたの捨て札</span></h2>
    <div class="disc" id="myDisc"></div>
  </div>

  <div class="area">
    <h2><span>🃏 あなたの手札</span><span id="handHint"></span></h2>
    <div class="hintbar" id="hintBar"></div>
    <div class="hand" id="hand"></div>
  </div>

  <div class="btns">
    <button class="act" id="btnDiscard">これを捨てる</button>
    <button class="act" id="btnSteal">ダーク略奪</button>
    <button class="act" id="btnWin">殲滅！</button>
    <button class="act hidden span2" id="btnRon">討伐！</button>
    <button class="act hidden" id="btnPass">見送る</button>
  </div>
    <div class="x-share-zone">
    <div class="x-share-title">このゲームを拡散！</div>
    <button type="button" class="x-link-btn" id="xShareBtn">🐦 Xでシェアする</button>
  </div>

  <div class="usage-notice">
    <span class="usage-title">🎥 実況・動画での使用について</span>
    「しょーもなゲームズ」シリーズは、YouTubeなどでの実況・配信・動画への使用OKです！広告付き・収益化された動画でもご自由にお使いください。<br>
    ただし、グレードアップ用の「合言葉」を画面に映したり読み上げたりするのはご遠慮ください。<br>
    それ以外は自由に、しょーもなく広めていただけると嬉しいです。
  </div>

  <a href="../../" class="back-link-btn">← ゲーム一覧に戻る</a>
</div>

<div id="layer"></div>

<script src="engine.js"></script>
<script>
(function(){
  'use strict';
  var E = window.KenEngine;
  var HUMAN = 0, CPU = 1, ROUNDS = 4, CPU_CAREFUL = true;
  var GAME_URL = 'https://kanae-project.github.io/syomona-games/games/011-card-battler-ken2/';
  var match = { round: 1, total: [0, 0] };
  var R = null, ultraChar = 0, state = 'idle', selected = null, newIdx = null, stealUsed = false, handOrder = [], reachAnnounced = false;
  var logLines = [], resolveHuman = null, resolveRon = null;
  var $ = function(id){ return document.getElementById(id); };
  var sleep = function(ms){ return new Promise(function(r){ setTimeout(r, ms); }); };
  var URLP = new URLSearchParams(location.search);
  var seed = URLP.get('seed'); // 開発用: ?seed=数字 で山札を固定
  var rngFn = seed ? E.mulberry32(+seed) : Math.random;

  // ---------- カード表示 ----------
  function imgSrc(id, uc){
    var ch = (uc === undefined ? ultraChar : uc);
    if (id === E.ULTRA) return 'images/' + E.CHARS[ch].key + '-ultra.png';
    var k = E.kOf(id), ext = (k === 0 || k === 3) ? 'jpg' : 'png';
    return 'images/' + E.CHARS[E.charOf(id)].key + '-' + E.TIER_KEYS[k] + '.' + ext;
  }
  var CHAR_ICON = ['🔥', '🛡️', '💧'];   // ドラゴン / ナイト / スライム
  function cardName(id, uc){
    if (id === E.ULTRA) return E.CHARS[uc === undefined ? ultraChar : uc].name + ' 涅槃';
    return E.CHARS[E.charOf(id)].name + ' ' + E.TIER_NAMES[E.kOf(id)];
  }
  function cardEl(id, opt){
    opt = opt || {};
    var d = document.createElement('div');
    var cls = 'card' + (id === E.ULTRA ? ' ultra' : E.isLight(id) ? ' light' : E.isDark(id) ? ' dark' : '') + (opt.mini ? ' mini' : '');
    d.className = cls;
    d.title = cardName(id, opt.uc);
    var lab = id === E.ULTRA ? '涅槃' : E.TIER_NAMES[E.kOf(id)];
    var mk = id === E.ULTRA ? '🌈' : CHAR_ICON[E.charOf(id)];
    d.innerHTML = '<span class="mk">' + mk + '</span><span class="pt">+' + E.pointOf(id) + '</span><div class="pic"><img alt="" src="' + imgSrc(id, opt.uc) + '"></div><div class="lab">' + lab + '</div>';
    return d;
  }
  function backEl(){ var d = document.createElement('div'); d.className = 'card back mini'; d.innerHTML = '<div class="pic">？</div>'; return d; }

  // 手札の自動整列（キャラ→系統(素/光/闇)→クラス、涅槃は最後）
  function sortedIds(p){
    var arr = [];
    for (var id = 0; id < 21; id++) for (var n = 0; n < p.h[id]; n++) arr.push(id);
    arr.sort(function(a, b){
      var ka = E.kOf(a), kb = E.kOf(b);
      var la = ka === 0 ? 0 : ka <= 3 ? 1 : 2, lb = kb === 0 ? 0 : kb <= 3 ? 1 : 2;
      return (E.charOf(a) - E.charOf(b)) || (la - lb) || (E.classOf(a) - E.classOf(b));
    });
    for (var w = 0; w < p.w; w++) arr.push(E.ULTRA);
    return arr;
  }

  // 待ち札の説明（見えていない残り枚数つき）
  function waitText(list){
    var SHORT = ['ドラゴン', 'ナイト', 'スライム'];
    return list.map(function(id){
      var nm = id === E.ULTRA ? '涅槃' : SHORT[E.charOf(id)] + E.TIER_NAMES[E.kOf(id)];
      return nm + '(残' + Math.max(E.unseenCount(R, HUMAN, id), 0) + ')';
    }).join(' ・ ');
  }

  // ---------- 描画 ----------
  function setMsg(t){ $('msg').textContent = t; }
  function addLog(t){ logLines.push(t); if (logLines.length > 2) logLines.shift(); $('log').innerHTML = logLines.map(function(l){ return '・' + l; }).join('<br>'); }

  function render(){
    if (!R) return;
    $('stRound').textContent = match.round; $('stRoundMax').textContent = ROUNDS;
    $('stMe').textContent = match.total[0]; $('stCpu').textContent = match.total[1];
    $('stDeck').textContent = R.deck.length;
    var cpuN = E.total(R.p[CPU].h, R.p[CPU].w);
    $('cpuCount').textContent = cpuN;
    $('cpuFirst').textContent = R.turn === CPU ? '先攻' : '';
    $('handHint').textContent = R.turn === HUMAN ? '先攻' : '';
    var backs = $('cpuBacks'); backs.innerHTML = '';
    for (var i = 0; i < cpuN; i++) backs.appendChild(backEl());
    fillDisc($('cpuDisc'), R.p[CPU].disc); fillDisc($('myDisc'), R.p[HUMAN].disc);

    var hand = $('hand'); hand.innerHTML = '';
    var lay = E.layoutHand(R.p[HUMAN].h, R.p[HUMAN].w);
    var ten = E.total(R.p[HUMAN].h, R.p[HUMAN].w) >= 10;
    var need = 9 - lay.matched, spareDark = 0;
    for (var q = 0; q < 21; q++) if (E.isDark(q)) spareDark += lay.left[q];
    var hb = $('hintBar'), hintBase;
    if (state === 'humanTurn' && ten) {
      hintBase = (need === 0 ? '✨ <b>上がれます！</b>「殲滅！」を押そう' : '上がりまで <b>あと' + need + '枚</b>')
        + '　🌑 余りダーク <b>' + spareDark + '/3</b>' + (spareDark >= 3 ? ' → <b>略奪OK！</b>' : '');
    } else { hintBase = state === 'ronPrompt' ? '' : '相手の番です…'; }
    handOrder = [];
    lay.groups.forEach(function(g){ g.cards.forEach(function(id){ handOrder.push(id); }); });
    lay.singles.forEach(function(id){ handOrder.push(id); });
    // リーチ（あと1枚で上がり）の案内
    var reachMap = null, reachHtml = '', meP = R.p[HUMAN];
    if (state === 'humanTurn' && ten) {
      if (need !== 0) {
        reachMap = {}; var anyReach = false;
        handOrder.forEach(function(id){ if (reachMap[id] === undefined) { reachMap[id] = E.discardWaits(meP.h, meP.w, id); if (reachMap[id].length) anyReach = true; } });
        var sid = selected !== null ? handOrder[selected] : null;
        if (sid !== null && reachMap[sid]) {
          reachHtml = reachMap[sid].length ? '<br>🔥 <b>捨てるとリーチ！</b> 待ち：' + waitText(reachMap[sid]) : '<br>これを捨ててもリーチにはなりません';
        } else if (anyReach) { reachHtml = '<br>💡 <b>リーチ</b>印の札を捨てるとリーチ（あと1枚で上がり）'; }
      }
    } else if (E.total(meP.h, meP.w) === 9) {
      var wl = E.waits(meP.h, meP.w);
      if (wl.length) reachHtml = (hintBase && hintBase !== '相手の番です…' ? '' : '') + '🔥 <b>リーチ中！</b> 待ち：' + waitText(wl);
    }
    hb.innerHTML = (state !== 'humanTurn' && reachHtml) ? reachHtml : hintBase + reachHtml;
    var freshIdx = -1;
    if (newIdx !== null) { for (var j = handOrder.length - 1; j >= 0; j--) if (handOrder[j] === newIdx) { freshIdx = j; break; } }
    var pos = 0;
    function mk(id){
      var idx = pos++, c = cardEl(id);
      if (idx === freshIdx) c.classList.add('fresh');
      if (reachMap && reachMap[id] && reachMap[id].length) c.classList.add('reach');
      if (selected !== null && idx === selected) c.classList.add('selected');
      c.addEventListener('click', function(){
        if (state !== 'humanTurn') return;
        selected = (selected === idx) ? null : idx; render();
      });
      return c;
    }
    lay.groups.forEach(function(g){
      var box = document.createElement('div');
      box.className = 'grp' + (g.full ? '' : ' partial');
      box.setAttribute('data-label', (g.kind === 'stair' ? '階段' : '3きょうだい') + (g.full ? '' : ' あと1枚'));
      g.cards.forEach(function(id){ box.appendChild(mk(id)); });
      hand.appendChild(box);
    });
    lay.singles.forEach(function(id){ hand.appendChild(mk(id)); });
    updateButtons();
  }
  function fillDisc(el, list){
    el.innerHTML = '';
    if (!list.length) { el.innerHTML = '<div class="empty">まだありません</div>'; return; }
    list.forEach(function(id){ el.appendChild(cardEl(id, { mini: true })); });
  }
  function setBtn(id, on, glow){
    var b = $(id); b.classList.toggle('on', !!on); b.classList.toggle('glow', !!glow);
  }
  function updateButtons(){
    var turn = state === 'humanTurn', ron = state === 'ronPrompt';
    $('btnRon').classList.toggle('hidden', !ron); $('btnPass').classList.toggle('hidden', !ron);
    $('btnWin').classList.toggle('hidden', ron); $('btnSteal').classList.toggle('hidden', ron); $('btnDiscard').classList.toggle('hidden', ron);
    if (ron) { setBtn('btnRon', true); setBtn('btnPass', true); return; }
    var canWin = turn && E.canTsumo(R, HUMAN);
    var canSteal = turn && !stealUsed && E.canSteal(R, HUMAN);
    setBtn('btnWin', canWin, canWin);
    setBtn('btnSteal', canSteal, canSteal);
    setBtn('btnDiscard', turn && selected !== null, false);
  }

  // ---------- オーバーレイ ----------
  var FX_IMG = { '殲滅！': 'images/fx-win.png', '討伐！': 'images/fx-ron.png', 'ダーク略奪！': 'images/fx-steal.png', '涅槃降臨！': 'images/fx-nehan.png' };
  function showFlash(big, small, ms){
    var f = document.createElement('div'); f.className = 'flash';
    var img = FX_IMG[big];
    f.innerHTML = (img ? '<img alt="' + big + '" src="' + img + '">' : '<div class="big">' + big + '</div>') + (small ? '<div class="small">' + small + '</div>' : '');
    var im = f.querySelector('img');
    if (im) im.addEventListener('error', function(){ im.outerHTML = '<div class="big">' + big + '</div>'; });
    $('layer').appendChild(f);
    return sleep(ms || 1400).then(function(){ f.remove(); });
  }
  // 引いた/奪った/奪われたカードを画面いっぱいに見せる（タップか時間で閉じる）
  function revealCards(title, ids, ms, sub){
    return new Promise(function(res){
      var o = document.createElement('div'); o.className = 'overlay reveal';
      var w = ids.length === 1 ? '64%' : ids.length === 2 ? '42%' : '29%';
      o.innerHTML = '<div class="rv-title">' + title + '</div><div class="rv-row"></div>'
        + '<div class="rv-name">' + ids.map(function(id){ return cardName(id); }).join(' ／ ') + '</div>'
        + (sub ? '<div class="rv-sub">' + sub + '</div>' : '') + '<div class="rv-tap">タップで閉じる</div>';
      var row = o.querySelector('.rv-row');
      ids.forEach(function(id){ var c = cardEl(id); c.classList.add('big'); c.style.width = w; row.appendChild(c); });
      var done = false, close = function(){ if (done) return; done = true; o.remove(); res(); };
      o.addEventListener('click', close);
      setTimeout(close, ms || 1500);
      $('layer').appendChild(o);
    });
  }
  // 涅槃が含まれていたら先に「涅槃降臨！」演出
  async function gainCards(title, ids, ms, sub){
    if (!ids || !ids.length) return;
    if (ids.indexOf(E.ULTRA) >= 0) await showFlash('涅槃降臨！', '', 1500);
    await revealCards(title, ids, ms, sub);
  }
  function showModal(html){
    var o = document.createElement('div'); o.className = 'overlay';
    var m = document.createElement('div'); m.className = 'modal'; m.innerHTML = html; o.appendChild(m);
    $('layer').appendChild(o);
    return { root: o, box: m, close: function(){ o.remove(); } };
  }

  // ---------- 局の進行 ----------
  async function startRound(){
    ultraChar = Math.floor(rngFn() * 3);
    R = E.createRound({ rng: rngFn, first: (match.round - 1) % 2 });
    selected = null; newIdx = null; stealUsed = false; reachAnnounced = false; logLines = []; $('log').innerHTML = '';
    state = 'idle'; render();
    setMsg('第' + match.round + '局スタート！ ' + (R.turn === HUMAN ? 'あなたの先攻' : '相手の先攻'));
    addLog('今回の涅槃は「' + E.CHARS[ultraChar].name + '」');
    await sleep(900);
    turnLoop(R.turn);
  }

  async function turnLoop(pi){
    while (true){
      if (!R.deck.length) { return endRound(null); }
      var res = (pi === HUMAN) ? await humanTurn() : await cpuTurnUI();
      if (res === 'ended') return;
      pi = 1 - pi;
    }
  }

  async function humanTurn(){
    stealUsed = false; selected = null;
    var got = E.drawFor(R, HUMAN);
    newIdx = got.length ? got[0] : null;
    state = 'humanTurn';
    setMsg('あなたの番：' + got.length + '枚引いた！ 捨てる札を選ぼう');
    render();
    await gainCards(got.length > 1 ? '引いたカード（相手に奪われた分を補充）' : '引いたカード', got, 1400);
    var action = await new Promise(function(res){ resolveHuman = res; });
    if (action.type === 'win') {
      var sc = E.scoreWin(R.p[HUMAN].h, R.p[HUMAN].w);
      await showFlash('殲滅！', 'あなたの上がり', 1300);
      endRound(HUMAN, 'tsumo', sc); return 'ended';
    }
    // 捨てる
    var id = handOrder[action.idx];
    var ron = E.discard(R, HUMAN, id);
    selected = null; newIdx = null; state = 'idle';
    addLog('あなた：' + cardName(id) + ' を捨てた');
    render();
    if (ron) {
      await showFlash('討伐！', '相手に上がられた…', 1400);
      endRound(CPU, 'ron', E.takeForRon(R, CPU)); return 'ended';
    }
    var wl2 = E.waits(R.p[HUMAN].h, R.p[HUMAN].w);
    if (wl2.length && !reachAnnounced) { reachAnnounced = true; await showFlash('リーチ！', '待ち：' + waitText(wl2), 1800); }
    else if (!wl2.length) { reachAnnounced = false; }
    return 'ok';
  }

  async function cpuTurnUI(){
    state = 'idle'; render();
    setMsg('相手の番…'); await sleep(800);
    var r = E.cpuTurn(R, CPU, { careful: CPU_CAREFUL });
    if (r.events && r.events.length) {
      var st = r.events[0].result;
      await showFlash('ダーク略奪！', '相手が' + (st.from === 'discard' ? 'あなたの捨て札から' : 'あなたの手札から') + '奪った…', 1600);
      addLog('相手：ダーク略奪で ' + cardName(st.card) + ' を奪われた');
      render();
      await revealCards('奪われたカード！', [st.card], 2000, st.from === 'discard' ? 'あなたの捨て札から奪われた' : 'あなたの手札から奪われた');
    }
    if (r.type === 'tsumo') {
      render();
      await showFlash('殲滅！', '相手の上がり', 1300);
      endRound(CPU, 'tsumo', r.score); return 'ended';
    }
    addLog('相手：' + cardName(r.card) + ' を捨てた');
    render();
    if (r.ronPossible) {
      state = 'ronPrompt'; render();
      setMsg('討伐チャンス！ 相手の捨てた ' + cardName(r.card) + ' で上がれる！');
      var take = await new Promise(function(res){ resolveRon = res; });
      if (take) {
        var sc = E.takeForRon(R, HUMAN);
        state = 'idle'; render();
        await showFlash('討伐！', 'あなたの上がり', 1300);
        endRound(HUMAN, 'ron', sc); return 'ended';
      }
      state = 'idle'; render();
    }
    return 'ok';
  }

  // ---------- ボタン ----------
  function explain(txt){ if (state === 'humanTurn') setMsg(txt); }
  $('btnWin').addEventListener('click', function(){
    if (state === 'humanTurn' && !E.canTsumo(R, HUMAN)) { var m = E.bestCover(R.p[HUMAN].h, R.p[HUMAN].w).m; explain('まだ上がれません。あと' + (9 - m) + '枚で殲滅できます（📖ルール参照）'); return; }
    if (state === 'humanTurn' && E.canTsumo(R, HUMAN) && resolveHuman) { var f = resolveHuman; resolveHuman = null; f({ type: 'win' }); }
  });
  $('btnDiscard').addEventListener('click', function(){
    if (state === 'humanTurn' && selected === null) { explain('捨てる札をタップして選んでから押してね'); return; }
    if (state === 'humanTurn' && selected !== null && resolveHuman) { var f = resolveHuman, i = selected; resolveHuman = null; f({ type: 'discard', idx: i }); }
  });
  $('btnRon').addEventListener('click', function(){ if (state === 'ronPrompt' && resolveRon) { var f = resolveRon; resolveRon = null; f(true); } });
  $('btnPass').addEventListener('click', function(){ if (state === 'ronPrompt' && resolveRon) { var f = resolveRon; resolveRon = null; f(false); } });
  $('btnSteal').addEventListener('click', async function(){
    if (state === 'humanTurn' && stealUsed) { explain('ダーク略奪は1ターンに1回までです'); return; }
    if (state === 'humanTurn' && !E.canSteal(R, HUMAN)) { explain('まだ略奪できません。手札の中で「上がりに使わない闇カード」が3枚たまると使えます（現在 ' + E.spareDark(R.p[HUMAN].h, R.p[HUMAN].w) + '/3）'); return; }
    if (state !== 'humanTurn' || stealUsed || !E.canSteal(R, HUMAN)) return;
    var choices = E.stealChoices(R, HUMAN);
    var pick = await pickSteal(choices);
    if (pick === 'cancel') return;
    var st = E.steal(R, HUMAN, pick);
    stealUsed = true; selected = null; newIdx = st.card;
    render();
    await showFlash('ダーク略奪！', '余りダーク3枚を捧げた！', 1400);
    await gainCards('奪ったカード！', [st.card], 1500, st.from === 'discard' ? '相手の捨て札から' : '相手の手札からランダムに');
    await gainCards('山から補充した札', st.drew, 1500);
    addLog('あなた：ダーク略奪で ' + cardName(st.card) + ' をゲット');
    setMsg('略奪成功！ 山から2枚補充した。捨てる札を選ぼう');
    render();
  });

  function pickSteal(choices){
    return new Promise(function(res){
      var html = '<h3>ダーク略奪</h3>';
      if (choices.length) {
        html += '<p>余りのダーク3枚を捧げて、相手の捨て札から<b>好きな1枚</b>を奪えます</p><div class="pick-grid" id="pickGrid"></div>';
      } else {
        html += '<p>相手の捨て札がないので、<b>相手の手札からランダムに1枚</b>奪います</p>';
      }
      html += '<div class="row-btns">' + (choices.length ? '' : '<button class="plain" id="pkGo">奪う！</button>') + '<button class="plain sub" id="pkCancel">やめる</button></div>';
      var m = showModal(html);
      if (choices.length) {
        var counts = {}; R.p[CPU].disc.forEach(function(id){ counts[id] = (counts[id] || 0) + 1; });
        choices.forEach(function(id){
          var c = cardEl(id); var cnt = document.createElement('span'); cnt.className = 'cnt'; cnt.textContent = '×' + counts[id]; c.appendChild(cnt);
          c.addEventListener('click', function(){ m.close(); res(id); });
          m.box.querySelector('#pickGrid').appendChild(c);
        });
      } else {
        m.box.querySelector('#pkGo').addEventListener('click', function(){ m.close(); res(null); });
      }
      m.box.querySelector('#pkCancel').addEventListener('click', function(){ m.close(); res('cancel'); });
    });
  }

  // ---------- 局の結果 ----------
  function endRound(winner, how, score){
    state = 'over'; render();
    var html = '<h3>第' + match.round + '局 結果</h3>';
    if (winner === null) {
      html += '<p>山札が尽きた…流局です（0点）</p>';
    } else {
      match.total[winner] += score.total;
      html += '<p style="font-size:1.05rem;font-weight:900">' + (winner === HUMAN ? 'あなたの勝ち！' : '相手の勝ち…') + '（' + (how === 'ron' ? '討伐' : '殲滅') + '）</p>';
      html += '<div class="hand-show" id="winHand"></div>';
      html += '<div class="legend">金色の枠＝上がりに使った3枚組（各組のカードの点数の合計）<br>点線の枠＝使わなかった余りの札</div>';
      html += '<div class="yaku"><div class="row"><span>基本点（3組の合計）</span><span>' + score.base + '</span></div>';
      score.yaku.forEach(function(y){ html += '<div class="row"><span>' + y.name + '</span><span>+' + y.bonus + '</span></div>'; });
      html += '<div class="row total"><span>合計</span><span>' + score.total + '点</span></div></div>';
    }
    html += '<p>あなた <b>' + match.total[0] + '</b> － <b>' + match.total[1] + '</b> 相手</p>';
    html += '<div class="row-btns"><button class="plain" id="nextBtn">' + (match.round < ROUNDS ? '次の局へ' : '結果発表へ') + '</button></div>';
    var m = showModal(html);
    if (winner !== null) {
      var box = m.box.querySelector('#winHand');
      score.groups.forEach(function(g){
        var f = document.createElement('div'); f.className = 'grp';
        f.setAttribute('data-label', (g.kind === 'stair' ? '階段' : '3きょうだい') + ' ' + g.points + '点');
        g.cards.forEach(function(id){ f.appendChild(cardEl(id, { mini: true })); });
        box.appendChild(f);
      });
      if (score.spare.length) {
        var sp = document.createElement('div'); sp.className = 'grp partial';
        sp.setAttribute('data-label', '余り');
        score.spare.forEach(function(id){ var c = cardEl(id, { mini: true }); c.style.opacity = '.55'; sp.appendChild(c); });
        box.appendChild(sp);
      }
    }
    setMsg(winner === null ? '流局' : (winner === HUMAN ? '殲滅成功！' : '殲滅されてしまった…'));
    m.box.querySelector('#nextBtn').addEventListener('click', function(){
      m.close();
      if (match.round < ROUNDS) { match.round++; startRound(); } else { finalResult(); }
    });
  }

  // ---------- 最終結果・引き分けバトル ----------
  function finalResult(){
    var a = match.total[0], b = match.total[1];
    if (a !== b) { return showFinal(a > b); }
    tieBattle();
  }
  function showFinal(win, battle){
    var m = showModal('<h3>' + (win ? 'あなたの勝ち！' : '相手の勝ち…') + '</h3><p>' + (battle ? '引き分けバトルを制した！' : '合計点') + '</p><p style="font-size:1.1rem">あなた <b>' + match.total[0] + '</b> － <b>' + match.total[1] + '</b> 相手</p><div class="row-btns"><button class="plain" id="againBtn">もう一度あそぶ</button></div>');
    m.box.querySelector('#againBtn').addEventListener('click', function(){ m.close(); match = { round: 1, total: [0, 0] }; startRound(); });
  }
  async function tieBattle(){
    var deck = [];
    for (var id = 0; id < 21; id++) for (var n = 0; n < 3; n++) deck.push(id);
    deck.push(E.ULTRA);
    E.shuffle(deck, rngFn);
    var m = showModal('<h3>引き分けバトル！</h3><p>同点！ 山から1枚ずつ引いて、強い方が勝ち（素は涅槃にだけ勝てる）</p><div class="versus"><div class="side"><div class="who">あなた</div><div id="tbMe"></div></div><div class="side"><div class="who">相手</div><div id="tbCpu"></div></div></div><p id="tbMsg"></p><div class="row-btns"><button class="plain" id="tbGo">カードを引く！</button></div>');
    var go = m.box.querySelector('#tbGo');
    go.addEventListener('click', function onGo(){
      var a = deck.pop(), b = deck.pop(), uc = Math.floor(rngFn() * 3);
      var meBox = m.box.querySelector('#tbMe'), cpuBox = m.box.querySelector('#tbCpu');
      meBox.innerHTML = ''; cpuBox.innerHTML = '';
      meBox.appendChild(cardEl(a, { uc: uc })); cpuBox.appendChild(cardEl(b, { uc: uc }));
      var cmp = E.battleCompare(a, b), msg = m.box.querySelector('#tbMsg');
      if (cmp === 0) { msg.textContent = '同格！ もう一回！'; return; }
      msg.textContent = cmp > 0 ? 'あなたの勝ち！' : '相手の勝ち…';
      go.textContent = '結果へ';
      go.onclick = function(){ m.close(); showFinal(cmp > 0, true); };
      go.removeEventListener('click', onGo);
    });
  }


  // ---------- ルール説明 ----------
  function showRules(){
    var html = '<h3>📖 ルール</h3><div class="rules">'
    + '<h4>🎯 目的</h4><p>手札9枚を<b>「3枚組」×3セット</b>にそろえて、<b>殲滅！</b>ボタンを押せば勝ち。その局の得点をゲットできます。</p>'
    + '<h4>🃏 毎ターンやること</h4><p>① 山から1枚引く（手札10枚になる）<br>② いらない1枚を捨てる（9枚に戻る）<br>これを相手と交互にくり返します。<b>10枚のうち9枚が3組になれば上がり</b>です（余る1枚は使いません）。</p>'
    + '<p class="small">手札の上に「上がりまであと○枚」を表示します。つながっているカードは金色の枠で囲んで見せます（点線の枠は「あと1枚」）。枠の外の札は今使っていない札＝捨て候補です。</p>'
    + '<h4>🧩 3枚組は2種類だけ</h4>'
    + '<p><b>① 進化の階段</b>…同じキャラ・同じ系統で、段階が連続する3枚</p><div class="ex" id="exStair"></div>'
    + '<p class="small">階段の作り方：素→光1→光2／光1→光2→光3／素→闇1→闇2／闇1→闇2→闇3</p>'
    + '<p><b>② 3きょうだい</b>…3キャラが、同じ系統・同じ段階で1枚ずつ</p><div class="ex" id="exKyo"></div>'
    + '<p class="small">系統（素・光・闇）が違うとNG。素だけ、光だけ、闇だけでそろえます。</p>'
    + '<h4>🌈 涅槃（ねはん）</h4><p>山札に<b>1枚だけ</b>入っている特別なカード。<b>どのカードの代わりにもなれる</b>万能札で、点数は4点です。</p>'
    + '<h4>⚔️ 討伐！（ロン）</h4><p>相手が捨てた札で自分が上がれるとき、<b>「討伐！」</b>ボタンが光ります。押すとその札をもらって上がり！</p>'
    + '<h4>🔥 リーチ</h4><p>あと1枚で上がれる状態を<b>リーチ</b>といいます。捨てる札を選ぶと「これを捨てるとリーチ！」と<b>待ち札</b>（見えていない残り枚数つき）を教えます。<b>リーチ</b>印の札を捨てるとリーチになります。待ち札が山から来れば<b>殲滅！</b>、相手が捨てれば<b>討伐！</b>です。</p>'
    + '<h4>🌑 ダーク略奪</h4><p>手札の中に「<b>上がりに使わない闇カード</b>」が<b>3枚</b>たまったら、「ダーク略奪」ボタンが光ります。3枚をささげて、<b>相手の捨て札から好きな1枚</b>を奪えます（捨て札が無ければ相手の手札からランダム）。その後、山から2枚補充。1ターンに1回まで。</p>'
    + '<h4>💯 点数</h4><p>基本点＝上がりに使った9枚の点数の合計。カードの<b>右上の「+○」</b>が点数です。<br>素＝0／光1・闇1＝1／光2・闇2＝2／光3・闇3＝3／涅槃＝4<br>これに役のボーナスが加わります。</p><p class="small">カードの左上のマークはキャラです：🔥ドラゴン・🛡️ナイト・💧スライム（🌈は涅槃）。</p>'
    + '<table><tr><td>涅槃入り</td><td>+3</td></tr><tr><td>階段×3（3組すべて階段）</td><td>+3</td></tr><tr><td>光系（闇なし。素はOK）</td><td>+3</td></tr><tr><td>3きょうだい×3</td><td>+6</td></tr><tr><td>闇系（光なし。素はOK）</td><td>+6</td></tr><tr><td>光一色／同キャラ一色</td><td>+10</td></tr><tr><td>闇一色</td><td>+12</td></tr><tr><td>同クラス一色</td><td>+15</td></tr></table>'
    + '<h4>🏁 勝敗</h4><p>全<b>4局</b>の合計点で勝負！ 先攻は毎局交代。山札が尽きたら流局（0点）。同点なら「引き分けバトル」（1枚ずつ引いて強い方が勝ち。涅槃＞光3・闇3＞光2・闇2＞光1・闇1＞素。ただし素は涅槃にだけ勝つ）。</p>'
    + '</div><div class="row-btns"><button class="plain" id="rulesClose">とじる</button></div>';
    var m = showModal(html);
    var add = function(id, ids){
      var box = m.box.querySelector('#' + id);
      ids.forEach(function(x, i){
        if (i) { var a = document.createElement('span'); a.className = 'arrow'; a.textContent = (id === 'exStair') ? '→' : '＋'; box.appendChild(a); }
        box.appendChild(cardEl(x, { uc: 0 }));
      });
    };
    add('exStair', [0, 1, 2]);   // ドラゴン 素→光1→光2
    add('exKyo', [2, 9, 16]);    // 3体の光2
    m.box.querySelector('#rulesClose').addEventListener('click', function(){ m.close(); });
    try { localStorage.setItem('ken2_rules_seen', '1'); } catch (e) {}
  }
  $('ruleBtn').addEventListener('click', showRules);
  try { if (!localStorage.getItem('ken2_rules_seen')) setTimeout(showRules, 400); } catch (e) {}

  // Xシェア（window.open方式）
  $('xShareBtn').addEventListener('click', function(){
    var t = match.total, played = match.round > 1 || state === 'over';
    var NL = String.fromCharCode(10);
    var head = 'カードバトラー★ケン2 ～お前のターンもある～';
    var text = head + NL + (played ? t[0] + '対' + t[1] + 'で対戦中！' + NL : '') + 'CMなしの0秒ブラウザゲーム！';
    window.open('https://x.com/intent/tweet?text=' + encodeURIComponent(text) + '&url=' + encodeURIComponent(GAME_URL), '_blank', 'noopener');
  });

  // 開発用フック（テスト用）
  window.__ken2 = { get R(){ return R; }, get state(){ return state; }, match: match, startRound: startRound, tieBattle: tieBattle, finalResult: finalResult, render: render, E: E };
  startRound();
})();
