<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>しょーもなゲームズ</title>
<style>
  :root{
    --bg1:#fff3d6;
    --bg2:#ffe0b0;
    --ink:#3a2a1a;
    --accent:#e8542a;
    --accent2:#c0392b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    font-family:"Hiragino Maru Gothic ProN","Rounded Mplus 1c","Yu Gothic",sans-serif;
    background:linear-gradient(160deg,var(--bg1),var(--bg2));
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:40px 16px 60px;
  }
  .wrap{ width:100%; max-width:480px; }
  h1{ text-align:center; font-size:1.8rem; margin:0 0 6px; }
  .sub{ text-align:center; font-size:.85rem; opacity:.7; margin-bottom:28px; }
  .card{
    display:block;
    background:rgba(255,255,255,.6);
    border:3px solid var(--ink);
    border-radius:18px;
    padding:18px 20px;
    margin-bottom:16px;
    text-decoration:none;
    color:var(--ink);
    transition:transform .15s ease;
  }
  .card:active{ transform:scale(.97); }
  .card-title{ font-size:1.2rem; font-weight:bold; color:var(--accent2); margin-bottom:4px; }
  .card-desc{ font-size:.85rem; opacity:.8; }
  .foot{ text-align:center; font-size:.75rem; opacity:.5; margin-top:30px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>しょーもなゲームズ</h1>
  <div class="sub">サクッと遊べる、しょーもないブラウザゲーム集</div>

  <a class="card" href="games/rifujin-okazu-obachan/">
    <div class="card-title">理不尽献立おばちゃん</div>
    <div class="card-desc">昨日のおかずを教えると、今日のメニューを勝手に決められます</div>
  </a>

  <a class="card" href="https://endearing-youtiao-3d3684.netlify.app">
    <div class="card-title">呼んだ？相棒！</div>
    <div class="card-desc">スパーク200を見つけてタップする、しょーもない反射神経ゲーム</div>
  </a>

  <a class="card" href="games/umaoka-seisan/">
    <div class="card-title">うまおかさん 雀卓精算帳</div>
    <div class="card-desc">対局後の素点からウマ・オカ・レートを自動計算する麻雀精算ツール</div>
  </a>

  <div class="foot">© しょーもなゲームズ</div>
</div>
</body>
</html>
